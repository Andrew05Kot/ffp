server:
  port: 8082
spring:
  application:
    name: ordering
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/micro_ordering
    username: postgres
    password: postgres
  profiles:
    active: testdata
  cloud:
    discovery:
      enabled: true
eureka:
  client:
    service-url:
      defaultZone: http://eurekaserver:8761/eureka
    fetch-registry: true
    register-with-eureka: true
