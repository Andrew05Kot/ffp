eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

server:
  port: 8081
spring:
  application:
    name: dish
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://127.0.0.1:5432/micro_dish
    username: postgres
    password: postgres
  h2:
    console:
      enabled: true
  profiles:
    active: testdata
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/ffd-app

jwt:
  auth:
    converter:
      resource-id: ffp-client
      principle-attribute: preferred_username

